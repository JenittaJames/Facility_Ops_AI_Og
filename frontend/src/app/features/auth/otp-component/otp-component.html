<div class="otp-container">

    <h2>Verify Your Account</h2>

    <p class="message">
        Enter the 6-digit OTP sent to your email.
    </p>

    <form [formGroup]="otpForm" (ngSubmit)="onSubmit()">

        <app-input-component label="otp" name="otp" placeholder="Enter your OTP" formControlName="otp" maxlength="6">
        </app-input-component>

        <app-button-component type="submit" [loading]="isLoading">Register</app-button-component>

    </form>

</div>
