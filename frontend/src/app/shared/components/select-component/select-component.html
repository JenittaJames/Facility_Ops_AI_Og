<div class="select-wrapper">

    @if (label) {
        <label [for]="name">
            {{ label }}
        </label>
    }

    <select
        [id]="name"
        [name]="name"
        [value]="value"
        [disabled]="disabled"
        (change)="onSelect($event)"
        (blur)="onBlur()"
    >

        <option
            value=""
            disabled
        >
            {{ placeholder }}
        </option>

        @for (option of options; track option.value) {

            <option [value]="option.value">
                {{ option.label }}
            </option>

        }

    </select>

</div>
