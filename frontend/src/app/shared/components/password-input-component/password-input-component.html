<div class="password-wrapper">

    @if (label) {
    <label [for]="name">
        {{ label }}
    </label>
    }

    <div class="input-container">

        <input [id]="name" [name]="name" [type]="showPassword ? 'text' : 'password'" [placeholder]="placeholder"
            [value]="value" [disabled]="disabled" (input)="onInput($event)" (blur)="onBlur()" />

        <button type="button" class="toggle-button" [disabled]="disabled" (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <mat-icon>
                {{ showPassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
        </button>

    </div>

</div>
